name: OpenWrt Build Test

on:
  push:
    branches: [ master ]
    paths:
      - 'openwrt-main/**'
      - 'openwrt-luci/**'
      - '*.c'
      - '*.h'
      - 'Makefile'
      - '.github/workflows/openwrt-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'openwrt-main/**'
      - 'openwrt-luci/**'
      - '*.c'
      - '*.h'
      - 'Makefile'
      - '.github/workflows/openwrt-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-openwrt-build:
    # 23.05 produces .ipk / opkg packages, 25.12 produces .apk / apk packages
    name: ${{ matrix.release }} / ${{ matrix.target[0] }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        release: [ "23.05.5", "25.12.5" ]
        target:
          # Format: [name, target, subtarget]
          - [x86_64, x86, 64]
          - [ramips_mt7621, ramips, mt7621]
          - [ath79_generic, ath79, generic]
          - [mediatek_filogic, mediatek, filogic]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            zstd \
            file \
            wget \
            python3 \
            python3-setuptools \
            python3-dev \
            swig

      - name: Download OpenWrt SDK
        run: |
          TARGET="${{ matrix.target[1] }}"
          SUBTARGET="${{ matrix.target[2] }}"
          BASE="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${TARGET}/${SUBTARGET}"

          # The SDK file name embeds the toolchain version and the compression
          # format changed between releases, so take it from the checksum list
          # instead of guessing.
          SDK_FILE=$(curl -fsSL "$BASE/sha256sums" \
            | awk '{ print $2 }' | sed 's|^\*||' \
            | grep -E '^openwrt-sdk-.*\.Linux-x86_64\.tar\.(xz|zst)$' | head -1) || true

          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK found at $BASE"
            exit 1
          fi

          echo "Downloading $SDK_FILE"
          # Keep the original suffix so that tar picks the right decompressor
          curl -fsSL "$BASE/$SDK_FILE" -o "$SDK_FILE"
          tar -xaf "$SDK_FILE"

          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -1)
          echo "OPENWRT_DIR=$(realpath "$SDK_DIR")" >> $GITHUB_ENV
          echo "SDK extracted: $SDK_DIR"

      - name: Install feeds
        run: |
          cd "${OPENWRT_DIR}"
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a -p base || true
          ./scripts/feeds install -a -p luci || true
          ./scripts/feeds install -a -p packages || true
          ./scripts/feeds install -a -p routing || true

          if [ ! -f feeds/luci/luci.mk ]; then
            echo "::error::LuCI feed is missing, luci-app-wg-obfuscator cannot be built"
            exit 1
          fi

      - name: Stage packages into the build tree
        run: |
          cd "${OPENWRT_DIR}"

          mkdir -p package/network
          ln -sf "$GITHUB_WORKSPACE/openwrt-main" package/network/wg-obfuscator

          # The LuCI Makefile is the one submitted to the feed: it pulls in
          # ../../luci.mk and lets luci.mk derive LUCI_NAME from the directory
          # name, neither of which holds for a symlink pointing out of the tree.
          FEED_APP="feeds/luci/applications/luci-app-wg-obfuscator"
          rm -rf "$FEED_APP"
          mkdir -p "$FEED_APP"
          tar -cf - -C "$GITHUB_WORKSPACE/openwrt-luci" --exclude=build.sh . \
            | tar -xf - -C "$FEED_APP"

          mkdir -p package/luci
          ln -sf "$(realpath "$FEED_APP")" package/luci/luci-app-wg-obfuscator

          chmod +x "$GITHUB_WORKSPACE/openwrt-main/files/wg-obfuscator.init"
          chmod +x "$GITHUB_WORKSPACE/openwrt-main/files/wg-obfuscator-config.sh"

          {
            echo "CONFIG_PACKAGE_wg-obfuscator=y"
            echo "CONFIG_PACKAGE_luci-app-wg-obfuscator=y"
            # One translation package per po/<lang>, named after the alias
            # luci.mk assigns to region-qualified codes
            for lang in $(ls "$GITHUB_WORKSPACE/openwrt-luci/po"); do
              case "$lang" in
                templates) continue ;;
                pt_BR)   suffix=pt-br ;;
                zh_Hans) suffix=zh-cn ;;
                zh_Hant) suffix=zh-tw ;;
                *)       suffix="$lang" ;;
              esac
              echo "CONFIG_PACKAGE_luci-i18n-wg-obfuscator-$suffix=y"
            done
          } >> .config
          make defconfig

      - name: Verify the release tarball and its hash
        # The source tarball is the same for every target, so check it once
        if: matrix.release == '25.12.5' && matrix.target[0] == 'x86_64'
        run: |
          cd "${OPENWRT_DIR}"

          # Fetches the tag archive the Makefile points at and verifies PKG_HASH
          # against it. A stale or missing hash fails the download outright,
          # which is also how the feed CI would reject the package.
          make package/wg-obfuscator/download V=s || {
            echo "::error::the release tarball does not match PKG_HASH"
            exit 1
          }

          echo "PKG_HASH matches the release tarball"

      - name: Build packages
        run: |
          cd "${OPENWRT_DIR}"

          # USE_SOURCE_DIR is the stock way to build a local tree, so the
          # Makefile can stay exactly as the feed expects it. It gets a copy
          # rather than the checkout itself because OpenWrt symlinks the build
          # directory at it and leaves object files behind.
          SRC_COPY="${RUNNER_TEMP}/wg-obfuscator-src"
          rm -rf "$SRC_COPY"
          mkdir -p "$SRC_COPY"
          cp "$GITHUB_WORKSPACE"/Makefile "$GITHUB_WORKSPACE"/LICENSE "$SRC_COPY/"
          cp "$GITHUB_WORKSPACE"/*.c "$GITHUB_WORKSPACE"/*.h "$SRC_COPY/"
          echo "SRC_COPY=$SRC_COPY" >> $GITHUB_ENV

          make package/wg-obfuscator/{clean,prepare,compile} \
            USE_SOURCE_DIR="$SRC_COPY" \
            V=s -j$(nproc) || {
              find logs -name "*.log" -type f 2>/dev/null | head -5 | xargs tail -50 2>/dev/null || true
              exit 1
            }

          make package/luci-app-wg-obfuscator/{clean,compile} \
            V=s -j$(nproc) || {
              find logs -name "*.log" -type f 2>/dev/null | head -5 | xargs tail -50 2>/dev/null || true
              exit 1
            }

      - name: Verify the local source tree was compiled
        run: |
          cd "${OPENWRT_DIR}"
          BUILD=$(find build_dir -maxdepth 2 -name "wg-obfuscator-*" | head -1)

          if [ -z "$BUILD" ]; then
            echo "::error::wg-obfuscator build directory not found"
            exit 1
          fi

          # USE_SOURCE_DIR turns the build directory into a symlink at the copy
          # of this checkout. Anything else means the package fell back to the
          # revision pinned in the Makefile.
          if [ ! -L "$BUILD" ] || [ "$(readlink -f "$BUILD")" != "$(readlink -f "$SRC_COPY")" ]; then
            echo "::error::$BUILD is not the local source tree"
            exit 1
          fi

          diff -q "$GITHUB_WORKSPACE/wg-obfuscator.c" "$BUILD/wg-obfuscator.c"
          echo "Compiled sources match the checkout"

      - name: Verify package contents
        run: |
          cd "${OPENWRT_DIR}"
          status=0

          # The staging tree is laid out identically for both ipk and apk
          check_files() {
            local pkg="$1"; shift
            local idir
            idir=$(find build_dir -type d -path "*/ipkg-*/$pkg" | head -1)

            if [ -z "$idir" ]; then
              echo "::error::staging directory for $pkg not found"
              status=1
              return
            fi

            echo "=== $pkg ($idir) ==="
            for f in "$@"; do
              if [ -e "$idir/$f" ]; then
                echo "  ok      $f"
              else
                echo "::error::$pkg is missing $f"
                status=1
              fi
            done
          }

          check_files wg-obfuscator \
            usr/bin/wg-obfuscator \
            etc/init.d/wg-obfuscator \
            etc/config/wg-obfuscator \
            usr/libexec/wg-obfuscator-config.sh

          check_files luci-app-wg-obfuscator \
            usr/share/luci/menu.d/luci-app-wg-obfuscator.json \
            usr/share/rpcd/acl.d/luci-app-wg-obfuscator.json \
            www/luci-static/resources/view/wg-obfuscator/settings.js

          for lang in $(ls "$GITHUB_WORKSPACE/openwrt-luci/po"); do
            case "$lang" in
              templates) continue ;;
              pt_BR)   suffix=pt-br ;;
              zh_Hans) suffix=zh-cn ;;
              zh_Hant) suffix=zh-tw ;;
              *)       suffix="$lang" ;;
            esac
            check_files "luci-i18n-wg-obfuscator-$suffix" \
              "usr/lib/lua/luci/i18n/wg-obfuscator.$suffix.lmo"
          done

          echo "=== built package files ==="
          found=0
          while read -r pkg; do
            echo "  $pkg ($(du -h "$pkg" | cut -f1))"
            found=$((found + 1))
          done < <(find bin \( -name "*wg-obfuscator*.ipk" -o -name "*wg-obfuscator*.apk" \) | sort)

          if [ "$found" -eq 0 ]; then
            echo "::error::no .ipk or .apk files were produced"
            status=1
          fi

          exit $status

      - name: Clean up
        if: always()
        run: |
          if [ -d "${OPENWRT_DIR}" ]; then
            rm -rf "${OPENWRT_DIR}/build_dir" "${OPENWRT_DIR}/staging_dir"
          fi

  test-openwrt-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test shell script syntax
        run: |
          for script in \
            openwrt-main/files/wg-obfuscator-config.sh \
            openwrt-main/files/wg-obfuscator.init \
            openwrt-main/test-version.sh \
            openwrt-main/build.sh \
            openwrt-luci/build.sh
          do
            bash -n "$script"
            echo "ok $script"
          done

          for script in openwrt-luci/root/etc/uci-defaults/*; do
            [ -f "$script" ] || continue
            bash -n "$script"
            echo "ok $script"
          done

      - name: Test JavaScript syntax
        run: |
          find openwrt-luci/htdocs -name "*.js" | while read -r f; do
            node --check "$f"
            echo "ok $f"
          done

      - name: Validate JSON files
        run: |
          find openwrt-luci/root -name "*.json" | while read -r f; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok $f"
          done

      - name: Validate translation catalogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext > /dev/null

          status=0
          for po in openwrt-luci/po/*/*.po; do
            if msgfmt -c -o /dev/null "$po"; then
              echo "ok $po"
            else
              echo "::error::$po is not a valid gettext catalog"
              status=1
            fi
          done

          exit $status

      - name: Check translations are in sync
        run: |
          pip install --quiet polib
          python3 - <<'PY'
          import glob, json, os, re, sys
          import polib

          # Mirrors what LuCI's build/i18n-scan.pl collects: _() calls in the
          # views plus the titles and descriptions in the menu and ACL files.
          found = set()
          for path in glob.glob('openwrt-luci/htdocs/**/*.js', recursive=True):
              text = open(path).read()
              found |= set(re.findall(r"_\('((?:[^'\\]|\\.)*)'\)", text))
              found |= set(re.findall(r'_\("((?:[^"\\]|\\.)*)"\)', text))

          for path in glob.glob('openwrt-luci/root/usr/share/rpcd/acl.d/*.json'):
              for group in json.load(open(path)).values():
                  found |= {group[k] for k in ('description',) if group.get(k)}

          for path in glob.glob('openwrt-luci/root/usr/share/luci/menu.d/*.json'):
              for node in json.load(open(path)).values():
                  found |= {node[k] for k in ('title',) if node.get(k)}

          catalogs = sorted(glob.glob('openwrt-luci/po/*/wg-obfuscator.po'))
          if not catalogs:
              print('::error::no translation catalogs found')
              sys.exit(1)

          failed = False

          # The template is what translators and Weblate consume, so a stale
          # one is as much of a defect as a missing translation.
          template = 'openwrt-luci/po/templates/wg-obfuscator.pot'
          template_ids = {e.msgid for e in polib.pofile(template)
                          if e.msgid and not e.obsolete}
          for s in sorted(found - template_ids):
              print(f'::error::{template} is stale, run build/i18n-sync.sh: missing {s}')
              failed = True
          for s in sorted(template_ids - found):
              print(f'::error::{template} is stale, run build/i18n-sync.sh: unused {s}')
              failed = True

          for path in catalogs:
              lang = os.path.basename(os.path.dirname(path))
              # msgmerge parks strings that the interface no longer uses in
              # "#~" blocks, which is what the rest of the LuCI feed carries
              # too, so they must not count as catalog content here.
              entries = [e for e in polib.pofile(path) if not e.obsolete]
              ids = {e.msgid for e in entries}

              for s in sorted(found - ids):
                  print(f'::error::{lang}: string is missing from the catalog: {s}')
                  failed = True
              for s in sorted(i for i in ids - found if i):
                  print(f'::warning::{lang}: catalog has an unused string: {s}')
              for e in entries:
                  if e.msgid and not e.msgstr:
                      print(f'::error::{lang}: string is untranslated: {e.msgid}')
                      failed = True
                  if 'fuzzy' in e.flags:
                      print(f'::warning::{lang}: string is marked fuzzy: {e.msgid}')

              print(f'{lang}: {len(ids)} entries')

          print(f'{len(found)} translatable strings across {len(catalogs)} catalogs')
          sys.exit(1 if failed else 0)
          PY

      - name: Test Makefile structure
        run: |
          status=0

          for mk in openwrt-main/Makefile openwrt-luci/Makefile; do
            grep -q 'include $(TOPDIR)/rules.mk' "$mk" || {
              echo "::error::$mk does not include rules.mk"; status=1; }
          done

          grep -q "define Build/Compile" openwrt-main/Makefile || {
            echo "::error::openwrt-main/Makefile has no Build/Compile"; status=1; }

          # The upstream Makefile appends -pthread to CFLAGS/LDFLAGS, but a
          # command line assignment wins over that, so it must be repeated here.
          grep -qE 'CFLAGS=.*-pthread' openwrt-main/Makefile || {
            echo "::error::openwrt-main/Makefile drops -pthread from CFLAGS"; status=1; }
          grep -qE 'LDFLAGS=.*-pthread' openwrt-main/Makefile || {
            echo "::error::openwrt-main/Makefile drops -pthread from LDFLAGS"; status=1; }

          # Both Makefiles have to stay in the exact shape the official feeds
          # expect, so that submitting them is a plain copy.
          grep -qF 'include ../../luci.mk' openwrt-luci/Makefile || {
            echo "::error::openwrt-luci/Makefile must include ../../luci.mk like every package in the LuCI feed"; status=1; }

          # The LuCI feed has no Lua CBI application left, so the interface has
          # to stay a client-side JS view to remain acceptable upstream.
          if grep -q 'luci-compat' openwrt-luci/Makefile; then
            echo "::error::openwrt-luci/Makefile must not depend on luci-compat"
            status=1
          fi

          if [ -e openwrt-luci/luasrc ]; then
            echo "::error::openwrt-luci/luasrc is back, the interface must stay a JS view"
            status=1
          fi

          grep -qE '^PKG_HASH:=[0-9a-f]{64}$' openwrt-main/Makefile || {
            echo "::error::openwrt-main/Makefile needs a real PKG_HASH"; status=1; }

          # The packages feed only accepts a git clone when upstream publishes
          # no release archive at all, and this one does.
          if grep -q '^PKG_SOURCE_PROTO:=git' openwrt-main/Makefile; then
            echo "::error::openwrt-main/Makefile must fetch the release tarball, not clone git"
            status=1
          fi

          if grep -q 'WG_OBFUSCATOR_SRC' openwrt-main/Makefile; then
            echo "::error::openwrt-main/Makefile carries a local source override, use USE_SOURCE_DIR instead"
            status=1
          fi

          exit $status

      - name: Validate file permissions
        run: |
          status=0

          for script in \
            openwrt-main/files/wg-obfuscator-config.sh \
            openwrt-main/files/wg-obfuscator.init \
            openwrt-main/test-version.sh \
            openwrt-main/build.sh \
            openwrt-luci/build.sh
          do
            if [ -x "$script" ]; then
              echo "ok $script"
            else
              echo "::error::$script is not executable"
              status=1
            fi
          done

          for script in openwrt-luci/root/etc/uci-defaults/*; do
            [ -f "$script" ] || continue
            if [ -x "$script" ]; then
              echo "ok $script"
            else
              echo "::error::$script is not executable"
              status=1
            fi
          done

          exit $status

  test-openwrt-config-generation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check UCI options and the config generator agree
        run: |
          CONFIG=openwrt-main/files/wg-obfuscator.config
          GENERATOR=openwrt-main/files/wg-obfuscator-config.sh
          MODEL=openwrt-luci/htdocs/luci-static/resources/view/wg-obfuscator/settings.js
          DOCS=docs/OPENWRT.md
          status=0

          shipped=$(sed -n "s/^[[:space:]]*option \([a-z_]*\) .*/\1/p" "$CONFIG" | sort -u)
          handled=$(sed -n 's/.*get_uci_value "\$section" "\([a-z_]*\)".*/\1/p' "$GENERATOR" | sort -u)

          # Empty lists would make everything below pass vacuously
          if [ "$(echo $shipped | wc -w)" -lt 5 ] || [ "$(echo $handled | wc -w)" -lt 5 ]; then
            echo "::error::option extraction returned almost nothing, the patterns in this check are stale"
            exit 1
          fi

          for opt in $handled; do
            echo "$shipped" | grep -qx "$opt" || {
              echo "::error::option '$opt' is read by the generator but missing from $CONFIG"
              status=1; }
          done

          for opt in $shipped; do
            echo "$handled" | grep -qx "$opt" || {
              echo "::error::option '$opt' is shipped in $CONFIG but ignored by the generator"
              status=1; }

            grep -qF "'$opt'" "$MODEL" || {
              echo "::error::option '$opt' is not exposed in the LuCI form ($MODEL)"
              status=1; }

            grep -qF '`'"$opt"'`' "$DOCS" || {
              echo "::error::option '$opt' is not documented in $DOCS"
              status=1; }
          done

          exit $status

      - name: Check the generated config stays off flash
        run: |
          # Regenerated on every start, so it must live on tmpfs
          status=0

          grep -q 'CONFIG_FILE="/var/etc/wg-obfuscator.conf"' \
            openwrt-main/files/wg-obfuscator-config.sh || {
              echo "::error::the config generator does not write to /var/etc"; status=1; }

          grep -q 'CONFIG_FILE="/var/etc/wg-obfuscator.conf"' \
            openwrt-main/files/wg-obfuscator.init || {
              echo "::error::the init script expects a different config path"; status=1; }

          if grep -q 'wg-obfuscator/wg-obfuscator.conf' openwrt-main/Makefile; then
            echo "::error::the generated config must not be packaged as a conffile"
            status=1
          fi

          exit $status
